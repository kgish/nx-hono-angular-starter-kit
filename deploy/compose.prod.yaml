# Production stack, copied to the server by .github/workflows/deploy.yml.
# IMAGE_PREFIX and IMAGE_TAG are exported by the workflow; everything else comes from .env.
name: fullstack

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${IMAGE_PREFIX:?}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set in .env}
      SEED_DEMO_USER: ${SEED_DEMO_USER:-false}
      SMTP_URL: ${SMTP_URL:?set in .env}
      MAIL_FROM: ${MAIL_FROM:?set in .env}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${IMAGE_PREFIX:?}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
