<div
  class="switcher"
  role="group"
  [attr.aria-label]="'app.language' | translate"
>
  @for (language of store.languages; track language.code) {
  <button
    type="button"
    [attr.lang]="language.code"
    [title]="language.name"
    [attr.aria-pressed]="store.current() === language.code"
    (click)="switchTo(language)"
  >
    {{ language.code | uppercase }}
  </button>
  }
</div>
