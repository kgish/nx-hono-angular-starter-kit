name: CI

on:
  pull_request:
  push:
    branches: [main]
  # deploy.yml calls this workflow before it deploys.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: true
  NX_DAEMON: false

jobs:
  checks:
    name: Lint, test, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: npm ci

      - uses: nrwl/nx-set-shas@v4

      - run: npx nx format:check
      - run: npx nx affected -t lint test typecheck build

  api-integration:
    name: API against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Receives the password-reset email; the API's default SMTP_URL points here.
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: npm ci

      - name: Build and start the bundled API
        run: |
          npx nx build api
          MIGRATIONS_DIR=dist/apps/api/migrations bun dist/apps/api/main.js &
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health && break; sleep 1; done

      - name: Smoke test auth and CRUD
        run: |
          set -euo pipefail
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/api/todos)" = 401
          # The API seeds the demo user outside production.
          curl -sf -c jar -X POST localhost:3000/api/auth/sign-in/email -H 'content-type: application/json' -d '{"email":"demo@example.org","password":"demo"}' | jq -e '.user.email == "demo@example.org"'
          curl -sf -b jar localhost:3000/api/auth/get-session | jq -e '.user.name == "Demo User"'
          id=$(curl -sf -b jar -X POST localhost:3000/api/todos -H 'content-type: application/json' -d '{"title":"ci"}' | jq -r .id)
          curl -sf -b jar -X PATCH localhost:3000/api/todos/$id -H 'content-type: application/json' -d '{"completed":true}' | jq -e '.completed == true'
          curl -sf -b jar localhost:3000/api/todos | jq -e 'length == 1'
          # Todos are per user: someone else sees none of them and cannot open this one.
          curl -sf -c jar2 -X POST localhost:3000/api/auth/sign-up/email -H 'content-type: application/json' -d '{"name":"CI","email":"ci@example.org","password":"ci-password"}' | jq -e '.user.email == "ci@example.org"'
          curl -sf -b jar2 localhost:3000/api/todos | jq -e 'length == 0'
          test "$(curl -s -b jar2 -o /dev/null -w '%{http_code}' localhost:3000/api/todos/$id)" = 404
          test "$(curl -s -b jar -o /dev/null -w '%{http_code}' -X POST localhost:3000/api/todos -H 'content-type: application/json' -d '{"title":""}')" = 400
          test "$(curl -s -b jar -o /dev/null -w '%{http_code}' -X DELETE localhost:3000/api/todos/$id)" = 204

      - name: Smoke test password reset
        run: |
          set -euo pipefail
          curl -sf -X POST localhost:3000/api/auth/request-password-reset -H 'content-type: application/json' -H 'accept-language: nl' -d '{"email":"demo@example.org","redirectTo":"/reset-password"}' | jq -e '.status == true'
          # The API sends after answering; wait for Mailpit to receive the email.
          for i in $(seq 1 20); do curl -sf localhost:8025/api/v1/messages | jq -e '.total > 0' >/dev/null && break; sleep 0.5; done
          message=$(curl -sf localhost:8025/api/v1/message/latest)
          echo "$message" | jq -e '.Subject == "Stel je wachtwoord voor Taken opnieuw in"'
          # SMTP delivers CRLF line endings, so stop the link at any whitespace.
          link=$(echo "$message" | jq -r .Text | grep -o 'http://[^[:space:]]*/reset-password/[^[:space:]]*')
          # The emailed link checks the token and redirects to the web page with it.
          location=$(curl -s -o /dev/null -w '%{redirect_url}' "$link")
          token=${location##*token=}
          curl -sf -X POST localhost:3000/api/auth/reset-password -H 'content-type: application/json' -d "{\"newPassword\":\"ci-new-password\",\"token\":\"$token\"}" | jq -e '.status == true'
          curl -sf -X POST localhost:3000/api/auth/sign-in/email -H 'content-type: application/json' -d '{"email":"demo@example.org","password":"ci-new-password"}' | jq -e '.user.email == "demo@example.org"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3000/api/auth/sign-in/email -H 'content-type: application/json' -d '{"email":"demo@example.org","password":"demo"}')" = 401
